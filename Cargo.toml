[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/ipc-protocol",
    "crates/identity",
    "crates/broker",
    "crates/cli",
    "crates/vault",
    "crates/ssh-agent",
    "crates/policy",
    "crates/connector-http",
    "crates/connector-pg",
    "crates/ebpfd",
    "crates/tls-acceptor",
    "crates/operator-core",
      "crates/integrations",
]
# `apps/desktop` is deliberately NOT a member. It is a separate workspace with
# its own `[workspace]` table, because the GUI needs webkit2gtk-4.1 / gtk+-3.0
# *headers* to build, and the pipeline runs `cargo build/test/clippy
# --workspace` in a clean container that has only the runtime. Listing it here
# would make every headless pipeline step fail for a dependency the core never
# touches. The shell has its own build command; see apps/desktop/README.md.
exclude = ["apps/desktop"]
# M0 deliberately shipped without a connector, so the UAT threat harness could
# run with an empty connector surface (docs/15-ROADMAP.md M0 Exit). M4 is the
# milestone that adds the first one: crates/connector-http carries address
# pinning, the redirect policy and the audited send path.

[workspace.package]
version = "0.36.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/rubentxu/agent-secretless"

[workspace.dependencies]
asv-domain = { path = "crates/domain" }
# R3: the credential workflow adapters. Depends on the vocabulary and nothing
# else -- a discovery step that could reach a vault would be a step that could be
# made to, and `discover` has no authority to lend.
asv-integrations = { path = "crates/integrations" }
asv-ipc-protocol = { path = "crates/ipc-protocol" }
asv-identity = { path = "crates/identity" }
asv-ssh-agent = { path = "crates/ssh-agent" }
asv-policy = { path = "crates/policy" }
asv-connector-http = { path = "crates/connector-http" }
asv-connector-pg = { path = "crates/connector-pg" }
asv-ebpfd = { path = "crates/ebpfd" }
asv-vault = { path = "crates/vault" }
# M9: the CONNECT bridge terminates TLS with a per-session leaf, so the
# broker is the first consumer of the acceptor. The direction is broker ->
# acceptor, never the reverse: the acceptor still cannot reach a vault or a
# key, which is the property its own crate boundary exists to hold.
asv-tls-acceptor = { path = "crates/tls-acceptor" }
# M9: the tls-acceptor integration tests need a real `SessionCa` to mint a real
# leaf, and that type lives in the broker. Declared here so the acceptor crate
# can name it as a path dependency; it is a dev-dependency there, so the
# published library's graph still does not reach the vault.
asv-broker = { path = "crates/broker" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# M9 runtime: real x509 for the per-session CA. Already in the lock via
# connector-http's test-support; declaring it here makes it a shared
# dependency instead of a per-crate version string.
rcgen = "0.13"
time = "0.3"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
nix = { version = "0.29", features = ["socket", "uio", "user", "fs", "sched"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync"] }
clap = { version = "4", features = ["derive", "env"] }
secrecy = "0.10"
zeroize = { version = "1", features = ["derive"] }

# M1 crypto primitives. docs/07-VAULT-CRYPTO-MEMORY.md §3 names these
# explicitly and forbids inventing a cipher or KDF, so the choices here are
# pinned by the spec, not by preference.
argon2 = "0.5"
chacha20poly1305 = "0.10"
aead = "0.5"
rand = "0.8"
sha2 = "0.10"
# M11 / C3: `client_secret_basic` is base64 over a form-encoded pair, and the
# authorization server that verifies it has to decode strictly. Already in the
# lock through `asv-connector-pg`; hand-rolling a decoder inside the component
# that holds a long-lived client secret is not a trade worth making.
base64 = "0.22"
hmac = "0.12"
subtle = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
cedar-policy = "=4.7.1"

# M4 HTTP transport (design v2 D1). reqwest with rustls, default features off:
# redirect handling and per-host address pinning have to be first-class, not
# something we re-derive on top of a lower-level stack. `url` parses the
# canonical authority form the policy already validated. `json` is what lets
# `RequestBuilder::json` build a semantic GitHub body; without it every
# request would hand-serialise into a string, which is how a title containing
# a quote turns into request structure.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "blocking",
    "json",
] }
url = "2"
# M9: `EstablishedTunnel` names `StreamOwned<ServerConnection, TcpStream>` in
# its public signature, so the broker has to name rustls types rather than hide
# them behind a box.
#
# The features must match every other rustls in the workspace, for the reason
# `asv-tls-acceptor` already documents: `rustls-tls` resolves to reqwest's
# `__rustls-ring`, and a mismatch leaves rustls unable to choose a
# CryptoProvider. It then panics at handshake time rather than failing the
# build, so the two tests that actually shake a hand are what catch it.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# M0 accepts a locked dependency set; versions are pinned after a compatibility
# and advisory review per docs/17-IMPLEMENTATION-BOOTSTRAP.md section 8, which
# explicitly declines to hardcode versions in the spec.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# The profile dist builds release artifacts with. It exists so that "the binary
# a user installs" and "the binary the pipeline tested" are the same binary,
# without making a release build inherit whatever `[profile.release]` happens to
# be tuned to for local iteration.
#
# `panic = "abort"` is inherited from release above, and that is deliberate for
# a daemon: the broker's journal is fsync'd before the work it describes, so a
# crash — panicked or killed — is recovered on the next start either way, and
# `Restart=on-failure` in the systemd unit turns the abort into a restart. What
# it does remove is the option of catching a panic in-process, which the unit
# comment in `packaging/asv-brokerd.service` depends on.
[profile.dist]
inherits = "release"
lto = "thin"
