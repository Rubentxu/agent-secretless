[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/ipc-protocol",
    "crates/identity",
    "crates/broker",
    "crates/cli",
    "crates/vault",
    "crates/ssh-agent",
    "crates/policy",
    "crates/connector-http",
    "crates/connector-pg",
    "crates/ebpfd",
]
# M0 deliberately shipped without a connector, so the UAT threat harness could
# run with an empty connector surface (docs/15-ROADMAP.md M0 Exit). M4 is the
# milestone that adds the first one: crates/connector-http carries address
# pinning, the redirect policy and the audited send path.

[workspace.package]
version = "0.9.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/rubentxu/agent-secretless"

[workspace.dependencies]
asv-domain = { path = "crates/domain" }
asv-ipc-protocol = { path = "crates/ipc-protocol" }
asv-identity = { path = "crates/identity" }
asv-ssh-agent = { path = "crates/ssh-agent" }
asv-policy = { path = "crates/policy" }
asv-connector-http = { path = "crates/connector-http" }
asv-connector-pg = { path = "crates/connector-pg" }
asv-ebpfd = { path = "crates/ebpfd" }
asv-vault = { path = "crates/vault" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
nix = { version = "0.29", features = ["socket", "uio", "user", "fs"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync"] }
clap = { version = "4", features = ["derive", "env"] }
secrecy = "0.10"
zeroize = { version = "1", features = ["derive"] }

# M1 crypto primitives. docs/07-VAULT-CRYPTO-MEMORY.md §3 names these
# explicitly and forbids inventing a cipher or KDF, so the choices here are
# pinned by the spec, not by preference.
argon2 = "0.5"
chacha20poly1305 = "0.10"
aead = "0.5"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
cedar-policy = "=4.7.1"

# M4 HTTP transport (design v2 D1). reqwest with rustls, default features off:
# redirect handling and per-host address pinning have to be first-class, not
# something we re-derive on top of a lower-level stack. `url` parses the
# canonical authority form the policy already validated. `json` is what lets
# `RequestBuilder::json` build a semantic GitHub body; without it every
# request would hand-serialise into a string, which is how a title containing
# a quote turns into request structure.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "blocking",
    "json",
] }
url = "2"

# M0 accepts a locked dependency set; versions are pinned after a compatibility
# and advisory review per docs/17-IMPLEMENTATION-BOOTSTRAP.md section 8, which
# explicitly declines to hardcode versions in the spec.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
