[package]
name = "asv-connector-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ASV HTTP connector: pinned transport for brokered semantic API calls"

[features]
# Exposes `fake_origin`, a local TLS server, so a crate *over* this one can
# drive the real connector against a real socket without touching the network.
# Optional and off by default: a production binary must not be able to pull in
# a test server, and the broker's dev-dependency is what turns it on.
test-support = ["dep:rcgen", "dep:rustls"]

[dependencies]
asv-domain.workspace = true
reqwest.workspace = true
url.workspace = true
thiserror.workspace = true
# M4: the semantic GitHub surface speaks JSON, and the `Authorization` header
# it builds from a borrowed secret is scrubbed as soon as the request is built.
serde_json.workspace = true
zeroize.workspace = true
# R2.F: the registry token endpoint takes the stored credential base64-encoded
# inside a `Basic` header. Already in the tree for the OAuth2 client-secret
# case, so this is a move rather than a new dependency.
base64.workspace = true
# Only ever reached through `test-support`. Declared optional so the default
# build carries neither of them.
rcgen = { version = "0.13", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[dev-dependencies]
# The fake servers need a real certificate, not a fixture string: "TLS host
# preservation" is a claim about SNI and certificate verification, and it can
# only be falsified by a handshake that actually happens.
rcgen = "0.13"
# The fake origin speaks real TLS, so it needs a server-side rustls. The
# provider feature has to match reqwest's: `rustls-tls` resolves to reqwest's
# `__rustls-ring`, so a mismatch leaves rustls unable to pick a
# CryptoProvider and it panics at handshake time with a message that does not
# mention which crate is wrong.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
