[package]
name = "asv-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The `asv` CLI. Controls sessions and capabilities; never returns a secret (ADR-0001)."

[[bin]]
name = "asv"
path = "src/main.rs"

[dependencies]
asv-domain.workspace = true
# R3: the discovery surface. A local filesystem read with no broker round
# trip, because `discover` has no authority to lend -- so there is nothing for
# a broker to authorise and a round trip would be a door with nothing behind it.
asv-integrations.workspace = true
asv-ipc-protocol.workspace = true
# R4.B.1: `integrations execute` builds an `AuthorizationRequest` to send to the
# broker. Already in the graph through `asv-ipc-protocol`, which re-exports
# these types in its own signatures — so this names a dependency the lock
# already had, rather than adding a crate. The CLI does not evaluate policy; it
# asks the broker to.
asv-policy.workspace = true
asv-ssh-agent.workspace = true
# `asv setup` creates the vault during installation, so the CLI links the
# encrypted store. This does not give the CLI a retrieval path: the store
# exposes create/open/persist and no read-a-secret-for-the-caller operation,
# and `no_subcommand_exposes_a_secret` still holds over the grown surface.
# The alternative — having setup shell out to `asv-vault-tool` — would mean
# shipping a binary the distribution manifest classifies as forbidden.
asv-vault.workspace = true
clap = { workspace = true }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Derives for the `asv.agent/v1` envelope. `serde_json` alone was enough when
# the CLI built JSON by hand, and building it by hand is what made every
# command a slightly different document.
serde.workspace = true
serde_json = "1"
# `SecretString` for the passphrase `asv setup` writes and `asv doctor` reads.
# Already in the lock via `asv-vault`; this makes an existing entry direct.
secrecy.workspace = true
# `Zeroizing` for the serialized request and the response buffer. `asv
# add-credential` puts a credential on this process's heap, and a `Vec<u8>` that
# is freed to the allocator still holds the bytes until something reuses the
# page. Already in the lock via `asv-ipc-protocol` and `asv-domain`; this makes
# an existing entry direct rather than adding anything new.
zeroize.workspace = true
# `asv registry blob push` computes the content address of the bytes it is
# about to publish. That is the client's claim about the content; the broker
# recomputes it independently in `RegistryClient::put_blob` and refuses a
# mismatch *before* opening a socket, so the two checks constrain each other
# instead of one trusting the other. Already in the lock via `asv-vault` and
# `asv-ssh-agent`; this makes an existing entry direct.
sha2.workspace = true
tokio = { workspace = true }
# `getuid()`, for deriving the default broker socket from the running user.
# Already in the lock via `asv-identity` and `asv-broker`, so this adds nothing
# new to the dependency graph — it only makes an existing entry direct.
libc = "0.2"

[dev-dependencies]
# `tempfile` is how the shim tests get a private session directory and a
# private listener socket. Already in the lock through `asv-ssh-agent`'s own
# dev-dependency, so this promotes an existing entry rather than adding to
# the dependency graph.
tempfile = "3"
