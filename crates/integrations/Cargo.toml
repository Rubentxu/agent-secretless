[package]
name = "asv-integrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Credential workflow adapters: describe a tool's configuration without reading its secrets."

[dependencies]
# The vocabulary, and nothing else. `Authority` is the reason an audience here
# is provably one spelling: a discovered registry host is canonicalized rather
# than passed through, so the binding an operator plans against is the binding
# the broker would authorize.
#
# This crate does NOT depend on the broker, the vault, the policy engine or the
# connectors, and must not. `discover` has no authority to lend, so a step that
# could reach a vault is a step that could be *made* to — and the report is the
# one artefact in R3 that travels furthest before anything is written.
asv-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
# The fingerprint's digest. Already in the workspace for the vault and the SSH
# agent, so this is a shared dependency rather than a new one.
sha2.workspace = true
thiserror.workspace = true
# `geteuid`, for the ownership check. The alternative is `nix`, which is in the
# workspace and would work, but it carries socket and scheduler features into a
# crate whose whole job is reading files. libc is already in the lock for
# ssh-agent and connector-pg, so this is a dependency rather than a new one --
# and it is the only unsafe call in the crate, in one function.
libc = "0.2"
# `adopt` is the one step that holds a value, and both of these exist so that
# holding it leaves no copy behind: `SecretString` redacts on `Debug` and on
# `Display`, and `Zeroizing` clears the file buffer and the extracted value in
# place on drop. Neither is a new dependency in the graph -- `add-credential`
# and every secret port already use them -- so this names a cost the crate was
# already paying rather than adding one.
secrecy.workspace = true
zeroize.workspace = true
# R3.B: the Maven family. Chosen over `quick-xml` for one reason that is a
# property rather than a preference: `roxmltree` declares **no dependencies at
# all** and is `#![forbid(unsafe_code)]`, so it cannot fetch anything and cannot
# reach the filesystem on its own. `quick-xml` at the version available offline
# also wants rustc 1.86, above the workspace's 1.85.
#
# What it does NOT provide is a nesting limit, and its element parsing recurses
# once per level. `nodes_limit` is therefore not optional here -- and it is not
# sufficient either: `MAX_NODES` in `maven.rs` bounds breadth, while depth is
# bounded separately by `MAX_DEPTH`, checked on the raw text, because the limit
# `roxmltree` offers is consulted only once the recursion has already gone as
# deep as the document goes.
roxmltree = "0.20"

[dev-dependencies]
tempfile = "3"
