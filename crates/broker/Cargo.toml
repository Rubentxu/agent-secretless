[package]
name = "asv-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ASV broker. Secret-bearing process, isolated by OS identity (ADR-0002)."

[features]
# M11 / C3: the authorization server the OAuth2 tests run against. Additive and
# off by default, so a production binary cannot pull in a server that hands out
# tokens. The broker's own dev-dependency on itself is what turns it on for the
# integration tests, which is the only place it should ever be reachable from.
test-support = ["asv-connector-http/test-support"]

[[bin]]
name = "asv-brokerd"
path = "src/main.rs"

[dependencies]
asv-domain.workspace = true
asv-ipc-protocol.workspace = true
# R9 audit chain frames serialize with serde_json (canonical for our types); the
# binary already ships it via tracing-subscriber, the lib names it explicitly.
serde_json = "1"
asv-identity = { workspace = true }
asv-policy.workspace = true
# M4 CU-2.2: the broker is the secret-bearing process, so it is the side that
# implements the connector's `SecretPort` and the only one that may name a
# `CredentialId`. The dependency points *out* of the connector, never into it:
# `asv-connector-http` does not depend on the vault, and adding one would make
# D2's one-way dependency a comment instead of a fact.
asv-connector-http.workspace = true
# M6: the broker also depends on the PostgreSQL connector for the same
# reason it depends on the HTTP one: the connector factory in
# `ConnectorFactory` returns clients for both protocols. The same
# one-way dependency rule (D2) applies: asv-connector-pg does not
# depend on the vault.
asv-connector-pg.workspace = true
asv-vault.workspace = true
# M9: `Bridge::serve_connect` terminates TLS presenting a per-session leaf,
# and `asv-tls-acceptor` is the crate that does the terminating. The
# dependency runs broker -> acceptor. It does not invert D2: the acceptor
# still has no vault, no CA key and no way to mint, so a cycle here could not
# become a path from a connector to the vault even in principle.
asv-tls-acceptor.workspace = true
# ADR-0019: the broker has to *verify* a CONNECT client's session proof, and
# `asv-ssh-agent` owns the key-blob format and the verification over it. The
# dependency points broker -> agent, and the private key never crosses it: what
# the broker names is `verify_proof`, which takes a blob, a nonce and a
# signature. One definition of the format, not two that can drift.
asv-ssh-agent.workspace = true
# See the workspace note: rustls is named in `EstablishedTunnel`'s signature.
rustls.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { workspace = true }
nix = { workspace = true }
libc = "0.2"
zeroize.workspace = true
# M4 surrogate tokens: 32 bytes of OS entropy per token, compared in constant
# time so a rejected guess leaks nothing about the real one.
rand.workspace = true
subtle.workspace = true
# The binary reads the passphrase from a file at startup; `SecretString` is
# `secrecy`'s, so the dependency lives here, not only under dev-deps.
secrecy.workspace = true
seccompiler = "0.4"
landlock = "0.4"
# R9 audit chain: record digests (sha2) and the operator-facing redacted DTO
# re-export (serde). Both already workspace-wide via the vault and protocol.
sha2 = { workspace = true }
# R2.C.1 SigV4: the four-step signing-key derivation is a chain of HMACs, and
# `hmac` is already resolved in the lock through the vault. This promotes it to
# a direct broker dependency rather than adding anything to the graph, which is
# the reason `aws-sigv4` is not used instead — a new name in a signed SBOM to
# avoid writing the chain by hand.
hmac = { workspace = true }
serde = { workspace = true }
# M9 runtime: the per-session CA and its leaves are real x509. `rcgen` and
# `time` are already in the lock through connector-http's test-support, so this
# promotes them to real broker dependencies rather than adding anything new.
rcgen = { workspace = true }
time = { workspace = true }
# M11 / C3: the issuer talks to a provider's token endpoint over real HTTPS.
# `reqwest` because it is already the workspace's HTTP stack with the same
# `rustls-tls` feature `asv-connector-http` uses, and a hand-rolled HTTP client
# inside the process that holds the long-lived client secret is a bad trade on
# every axis at once: it would be a second HTTP implementation to get right, in
# the one component whose compromise leaks a credential that does not expire.
reqwest.workspace = true
url.workspace = true
# M11 / C3: the authorization server has to decode `client_secret_basic`
# strictly, because a lenient decode would agree with a client that encoded it
# wrong and the whole check would be worth nothing.
base64.workspace = true

[dev-dependencies]
# The integration tests need the broker's `test-support` feature, and a crate
# cannot turn on its own feature from inside itself. Depending on itself here is
# the supported way to say it: it applies to the lib *as a dependency of the
# test*, and never to the binary.
asv-broker = { path = ".", features = ["test-support"] }
serde_json = "1"
tempfile = "3"
# The end-to-end tests drive the real connector against a local TLS origin.
# A dev-dependency, not a normal one: the broker binary must not be able to
# start a test server even if someone asks nicely.
asv-connector-http = { workspace = true, features = ["test-support"] }
# UAT-030 also exercises 100 SSH signatures against the M2 signer (this
# milestone's exit criterion), not only 100 HTTP reads. The broker stays
# unaware of SSH: this dev-dependency exists so the test can drive the
# signer's deterministic entry point over its real Unix socket and verify
# the produced signatures with `ed25519_dalek::Verifier`.
asv-ssh-agent = { workspace = true }
ed25519-dalek = "2"
# M6 UAT-039: the broker's integration test for the PostgreSQL
# connector lives here. The broker is already a normal dep, but the
# test also needs to reach the connector-pg types directly to
# introspect Command configuration. Declared as a dev-dependency to
# keep the production broker binary free of any test-only import.
asv-connector-pg = { workspace = true }
# M7 UAT-024: the broker's integration test exercises the privileged
# helper's closed verb set from the broker's side. Declared as a
# dev-dependency so the production binary does not link against the
# helper until the M8 eBPF redirect is wired.
asv-ebpfd = { workspace = true }
