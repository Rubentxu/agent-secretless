[package]
name = "asv-connector-pg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ASV PostgreSQL connector: pinned transport for brokered semantic DB calls"

[features]
# Exposes `fake_pg`, a local in-process TCP server that speaks the
# PostgreSQL startup protocol enough to drive the real connector against a
# real socket without touching the network. Optional and off by default,
# matching the pattern set by asv-connector-http's `test-support`.
test-support = []

[dependencies]
asv-domain.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "net", "rt", "rt-multi-thread", "macros", "time"] }
zeroize.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# The fake server is only ever linked into tests; it is gated behind
# cfg(test) in src/ so this dev-dependency exists for clarity and to keep
# the feature parity with asv-connector-http.