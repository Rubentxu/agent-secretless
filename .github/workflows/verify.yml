name: verify

# M0 has no CI yet, which means the only machine that can break this project is
# the one that wrote it. These jobs are the same gates run by hand during the
# cycle, kept deliberately close to what `sddk` records so a green run here and
# a green local run mean the same thing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: rust toolchain gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

  postgres-substrate:
    name: UAT-033 against a real PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL
        # The runner ships the client but not always the server binaries the
        # script needs for `initdb` and `pg_ctl`. Installing explicitly pins
        # the version rather than depending on the runner image.
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib

      - name: Run the UAT-033 suites against a real server
        # Without a substrate these 18 tests print a skip and report `ok`.
        # That is how `pg_policy::classify` called `SELECT ... INTO` a read
        # for a release cycle and a half while the suite stayed green: the
        # tests that would have caught it were skips. The script sets
        # ASV_UAT033_REQUIRE=1, so here a substrate that fails to come up is
        # a job failure instead of a silent pass.
        run: scripts/uat033-pg-substrate.sh run

  adversarial:
    name: adversarial harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Build the binaries the harness attacks
        # The harness attacks real `asv-brokerd` and `asv` processes, so they
        # have to exist before it runs. Without this step every probe that needs
        # a binary reports INVALID, which is the harness correctly refusing to
        # pass rather than the product being broken.
        run: cargo build --workspace --locked

      - name: Run the threat harness
        # A green harness is only meaningful if it can fail, so the same job
        # runs the falsification suite. If this ever passes vacuously again, the
        # job still goes green, which is exactly the failure mode the
        # falsification test exists to prevent.
        run: |
          python3 tests/adversarial/run_harness.py
          python3 tests/adversarial/test_falsifiability.py

  spec-pack:
    name: signed spec pack integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the manifest
        # The pack is normative and imported byte-for-byte. A modified file
        # means either an unreviewed edit or a corrupted checkout; both are
        # failures, not warnings.
        run: |
          cd agent-secretless-vault-spec
          sha256sum --check --strict SHA256SUMS

      - name: Gate-map audit
        # Reports the known roadmap UAT gate-map defects. It is expected to exit
        # non-zero while those defects are tracked in the backlog, so the exit
        # code is recorded rather than enforced here.
        run: python3 tools/check-gates.py
        continue-on-error: true
